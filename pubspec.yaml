name: harkai
description: Reportes y ayuda para tu comunidad.
publish_to: none
version: 4.0.0+3
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  google_sign_in: ^7.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  image_picker: ^1.2.1
  record: ^6.1.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/images/google_logo.png
